# Project-owned link-check exclusions, merged with the canonical .limen/lychee.toml.
exclude = [
  # The site's own hostnames: the canonical URLs in each page head, and the
  # Pages hostname in site/_redirects. Checking them from the tree would test
  # the deployment, not the content, and fails until the first deploy.
  '^https://godolint\.farcloser\.world(/|$)',
  '^https://website-godolint\.pages\.dev(/|$)',
]
